# Optional PACS (Orthanc + OHIF). Kept out of docker-compose.yml so the Coolify production stack is unchanged.
# Run alongside the main stack: docker compose -f docker-compose.yml -f docker-compose.pacs.yml up -d orthanc ohif
services:
  orthanc:
    image: orthancteam/orthanc:24.10.3
    restart: unless-stopped
    environment:
      ORTHANC__NAME: JMSURF-PACS
      ORTHANC__DICOM_AET: JMSURFPACS
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: /dicom-web/
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_USER:-orthanc}": "${ORTHANC_PASSWORD:-change-me}"}'
      ORTHANC__WORKLISTS__ENABLE: "true"
      ORTHANC__WORKLISTS__DATABASE: /var/lib/orthanc/worklists
      OHIF_PLUGIN_ENABLED: "true"
      ORTHANC__OHIF__DATA_SOURCE: dicom-web
    volumes:
      - orthancdata:/var/lib/orthanc/db
      - orthancworklists:/var/lib/orthanc/worklists
    ports:
      - "4242:4242" # DICOM (modalities send studies / query worklist here)
    expose:
      - "8042"
  ohif:
    image: ohif/app:v3.9.2
    restart: unless-stopped
    depends_on: [orthanc]
    environment:
      APP_CONFIG: /usr/share/nginx/html/app-config.js
    expose:
      - "80"

volumes:
  orthancdata:
  orthancworklists:
