name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: jmsurf, POSTGRES_PASSWORD: jmsurf, POSTGRES_DB: jmsurf_hmis }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jmsurf:jmsurf@localhost:5432/jmsurf_hmis?schema=public
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - run: cd apps/api && npx prisma generate && npx prisma db push --skip-generate
      - run: cd apps/api && npx tsc --noEmit -p tsconfig.json && npx jest
      - run: cd apps/api && pnpm build && npx ts-node prisma/seed.ts
      - run: pnpm --filter @jmsurf-hmis/mock-servers build
      - run: pnpm --filter @jmsurf-hmis/web build
